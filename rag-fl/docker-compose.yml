services:

  # ── Redis 7 — append-only persistence, 512 MB cap ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ragfl-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ragfl
    command:
      - redis-server
      - --appendonly yes
      - --maxmemory 512mb
      - --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Fake GCS Server — LOCAL DEVELOPMENT ONLY ─────────────────────────────
  # To use: docker compose --profile fake-gcs up -d
  # To switch to real GCS: unset GCS_ENDPOINT or set to https://storage.googleapis.com
  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    container_name: ragfl-fake-gcs
    profiles: ["fake-gcs"]
    ports:
      - "4443:4443"
    volumes:
      - gcs_data:/data
    networks:
      - ragfl
    command:
      - -scheme
      - http
      - -port
      - "4443"
      - -filesystem-root
      - /data
      - -public-host
      - fake-gcs:4443

  # ── Gotenberg — LibreOffice headless REST service (PPTX/DOCX → PDF) ───────
  libreoffice:
    image: gotenberg/gotenberg:8
    container_name: ragfl-libreoffice
    ports:
      - "3000:3000"
    networks:
      - ragfl
    environment:
      - GOTENBERG_API_TIMEOUT=60s

  # ── Ingestion Service — Phase 2 ──────────────────────────────────────────
  ingestion:
    build:
      context: .                                  # project root (needs shared/ + services/)
      dockerfile: services/ingestion/Dockerfile
    container_name: ragfl-ingestion
    ports:
      - "${INGESTION_PORT:-8001}:8001"
    volumes:
      - "${INPUT_DIR}:/input"
      - "${OUTPUT_DIR}:/output"
      # Mount GCS credentials for real GCS access (only used when GCS_ENDPOINT is real)
      - "./creds:/app/creds:ro"
    networks:
      - ragfl
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB=${MONGODB_DB}
      - GCS_ENDPOINT=${GCS_ENDPOINT}
      - GCS_BUCKET=${GCS_BUCKET}
      - REDIS_URL=${REDIS_URL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      # For real GCS: uses service account key mounted from ./creds/
      - GOOGLE_APPLICATION_CREDENTIALS=/app/creds/service-account-key.json
      - ENVIRONMENT=${ENVIRONMENT}
      - DRY_RUN_THRESHOLD=${DRY_RUN_THRESHOLD}
      - LIBREOFFICE_URL=${LIBREOFFICE_URL}
      - VECTOR_SEARCH_BACKEND=${VECTOR_SEARCH_BACKEND}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── rag-fl Pipeline Service — Phase 3 ────────────────────────────────────
  rag-fl:
    build:
      context: .
      dockerfile: services/rag-fl/Dockerfile
    container_name: ragfl-pipeline
    ports:
      - "${RAG_FL_PORT:-8004}:8004"
    volumes:
      - "${OUTPUT_DIR}:/output"
      # Mount GCS credentials for real GCS access (only used when GCS_ENDPOINT is real)
      - "./creds:/app/creds:ro"
    networks:
      - ragfl
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB=${MONGODB_DB}
      - GCS_ENDPOINT=${GCS_ENDPOINT}
      - GCS_BUCKET=${GCS_BUCKET}
      - REDIS_URL=${REDIS_URL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      # For real GCS: uses service account key mounted from ./creds/
      - GOOGLE_APPLICATION_CREDENTIALS=/app/creds/service-account-key.json
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - VISION_MODEL=${VISION_MODEL}
      - ENVIRONMENT=${ENVIRONMENT}
      - DRY_RUN_THRESHOLD=${DRY_RUN_THRESHOLD}
      - FORCE_MIXED_MODE=${FORCE_MIXED_MODE}
      - OUTPUT_DIR=/output
      # - SEED_FILES=${SEED_FILES:-tests/sample-docs/CustomerChurn_Jan2025.xlsx,tests/sample-docs/PureTable_CustomerChurn_Jan2025.pdf,tests/sample-docs/SS_CustomerChurn_Jan2025.pdf}
      - VECTOR_SEARCH_BACKEND=${VECTOR_SEARCH_BACKEND}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Next.js Observability UI — Phase 4 ───────────────────────────────────
  ui:
    build:
      context: ./services/ui
    container_name: ragfl-ui
    ports:
      - "3001:3001"
    networks:
      - ragfl
    depends_on:
      - ingestion
      - rag-fl
    environment:
      # Browser fetches these directly (localhost = host machine from browser)
      - NEXT_PUBLIC_RAG_FL_API=${NEXT_PUBLIC_RAG_FL_API}
      - NEXT_PUBLIC_INGESTION_API=${NEXT_PUBLIC_INGESTION_API}
      - NEXT_PUBLIC_FORCE_MIXED_MODE=${FORCE_MIXED_MODE:-false}
    restart: unless-stopped

networks:
  ragfl:
    driver: bridge

volumes:
  redis_data:
  gcs_data:
